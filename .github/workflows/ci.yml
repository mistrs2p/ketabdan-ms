# Continuous Integration (Task 5.13; docs/13-CI.md).
#
# One workflow, four jobs, all blocking (a red check means the branch does
# not merge — the explicit failure policy is below and in docs/13 §4):
#
#   backend   compileall + pip check + full pytest suite
#   frontend  ESLint + Vitest + production build
#   docker    compose configs + both image builds + worker runtime
#             compatibility + Caddyfile syntax
#   security  gitleaks (secret scan, full history) + pip-audit + npm audit
#             + bandit
#
# CI needs NO secrets. Every job runs with `permissions: contents: read`
# only, so untrusted fork PRs can run the exact same pipeline without any
# secret ever being exposed to their code (docs/13 §7). No job deploys,
# contacts Telegram/Bale, or requires real credentials. The backend job
# gets a disposable PostgreSQL *service container* for the ten real
# migration integration tests (the rest of the suite runs on in-memory
# SQLite and fakeredis — the compose validation uses the committed
# .env.prod.example fake values).
#
# Failure policy — CI FAILS on: test failures, lint errors, build errors,
# broken compose/Dockerfile configs, real secrets detected by gitleaks, and
# known vulnerabilities at or above the audit severity gates. CI does NOT
# fail on: harmless warnings, low-severity informational findings, or
# documented dependency exceptions (docs/13 §6 keeps that list).
#
# Third-party actions are pinned to immutable commit SHAs (docs/13 §5) —
# never to a mutable tag, so a compromised upstream tag cannot change what
# runs in this repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# One run per ref; superseded pushes cancel (harmless — jobs are stateless).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the local test workflow (README "Development"); keeps test
  # output/paths deterministic on any runner locale.
  PYTHONUTF8: "1"

jobs:
  backend:
    name: Backend (compile, pip check, tests)
    runs-on: ubuntu-latest
    # Disposable PostgreSQL for the migration integration tests
    # (test_*_seed_migration.py): they run the real Alembic chain against
    # a throwaway database on this server — never mocked. Same major
    # version as the development/production stacks (docker-compose*.yml).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out the repository
        # v4.2.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          # Cache the pip download cache (wheel files) keyed on the
          # dependency manifests — NOT a virtual environment, so a corrupt
          # cached env can never mask a broken dependency set (docs/13 §8).
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies (project + dev group)
        # `--group dev` needs pip >= 25.1 (PEP 735 dependency-groups
        # support), hence the upgrade; this stays the project's single
        # Python dependency source — no second package manager.
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .

      - name: Byte-compilation check
        run: python -m compileall -q app tests worker_healthcheck.py

      - name: Dependency consistency (pip check)
        run: python -m pip check

      - name: Tests (in-memory SQLite + fakeredis)
        # No DATABASE_URL here: without it, the migration integration
        # tests SKIP with their documented reason (their real run is the
        # next step) — and the config-hardening tests see the same
        # environment as a developer without a .env file.
        run: python -m pytest

      - name: Migration tests (real PostgreSQL, disposable databases)
        # The same ten tests, now for real against the service container:
        # each creates a throwaway database, runs the actual Alembic
        # chain (upgrade/downgrade/re-upgrade), and drops it. Never
        # mocked, never skipped here.
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
        run: >-
          python -m pytest
          tests/test_seed_migration.py
          tests/test_authz_seed_migration.py
          tests/test_responsibility_seed_migration.py

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out the repository
        # v4.2.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node 22
        # Same major as the web Dockerfile base image, so what CI builds
        # and tests is what ships in the container.
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          # npm's own cache (downloaded tarballs), keyed on the lockfile —
          # never node_modules itself.
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Use the lockfile's npm major (11)
        # package-lock.json is generated and maintained by npm 11 (the
        # local toolchain); node:22's bundled npm is older and rejects
        # the lock as out of sync ("Missing: @swc/helpers@0.5.23 from
        # lock file"). Same fix the web Dockerfile already applies
        # (apps/web/Dockerfile deps stage).
        run: npm install -g npm@11

      - name: Install dependencies (npm ci — exact lockfile state)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests (Vitest)
        run: npm test

      - name: Production build (next build)
        run: npm run build

  docker:
    name: Docker (compose configs, image builds, worker runtime)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        # v4.2.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate compose configurations
        # The production config is validated against the committed
        # .env.prod.example — fake, public-safe values only; CI never sees
        # real credentials.
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml config -q

      - name: Build application images
        run: >
          docker compose --env-file .env.prod.example
          -f docker-compose.prod.yml build api web

      - name: Worker runtime compatibility
        # The worker shares the API image with a different entrypoint
        # (python -m app.worker). Prove that entrypoint's imports resolve
        # in the built image — Redis URL parsing only, no live services
        # (--no-deps).
        run: >
          docker compose --env-file .env.prod.example
          -f docker-compose.prod.yml run --rm --no-deps api
          python -c "from app.worker.worker import WorkerSettings;
          assert 'redis_settings' in WorkerSettings.__dict__"

      - name: Caddyfile syntax
        # WEB_DOMAIN is a fake value — caddy validate checks config
        # syntax offline; the {$WEB_DOMAIN} site address must simply
        # expand to something non-empty. No network, no certificates.
        run: |
          for caddyfile in deploy/Caddyfile deploy/Caddyfile.local; do
            echo "Validating $caddyfile"
            docker run --rm \
              -e WEB_DOMAIN=localhost \
              -v "$(pwd)/$caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2 caddy validate --config /etc/caddy/Caddyfile
          done

  security:
    name: Security (gitleaks, pip-audit, npm audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (full history for gitleaks)
        # v4.2.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        # v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Set up Node 22
        # v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Secret scanning (gitleaks, full git history)
        # Pinned binary download with digest verification — no action
        # dependency, no license key, no credentials (docs/13 §5). The
        # repository is expected to stay clean: this is a blocking gate,
        # not informational.
        run: |
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" \
            | sha256sum --check --strict -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
          ./gitleaks detect --source . --redact

      - name: Python dependency audit (pip-audit)
        # Audits exactly the project's resolved dependency closure: the
        # frozen set is captured BEFORE pip-audit is installed, so
        # pip-audit's own tooling dependencies are never part of the
        # audit. Fresh pip first — the venv's bundled pip itself can
        # otherwise be the only finding.
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .
          python -m pip freeze --exclude-editable > /tmp/frozen-requirements.txt
          python -m pip install pip-audit
          python -m pip_audit --requirement /tmp/frozen-requirements.txt

      - name: Frontend dependency audit (npm audit, production deps)
        # Gate: critical, production dependencies only. Known exceptions
        # and their rationale are tracked in docs/13 §6 — anything new at
        # critical severity fails the build. npm is pinned to major 11
        # first for the same reason as the frontend job (lockfile shape).
        working-directory: apps/web
        run: |
          npm install -g npm@11
          npm ci
          npm audit --omit=dev --audit-level=critical

      - name: Static security analysis (bandit)
        # -ll: report medium and above (the calibrated level — low-severity
        # style findings are noise for this codebase, docs/13 §5).
        working-directory: apps/api
        run: |
          python -m pip install bandit==1.9.4
          bandit -r app worker_healthcheck.py -ll --quiet
