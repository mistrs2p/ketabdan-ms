# LOCAL DEVELOPMENT infrastructure only (Task 5.11 split): just PostgreSQL
# and Redis with host ports for running the API/worker/web as local dev
# servers (see README.md "Development"). The production runtime topology
# lives in docker-compose.prod.yml.

name: ketabdaneh

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      # Values come from .env (copy from apps/api/.env.example to repo root or
      # export them). Never commit real secrets.
      POSTGRES_USER: ${POSTGRES_USER:-ketabdaneh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ketabdaneh_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ketabdaneh}
    ports:
      # Host port 5433 by default: a native Windows PostgreSQL service may
      # already occupy host port 5432 on this machine, which silently
      # hijacks `localhost:5432` connections meant for this container.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # postgres:18+ recommended mount point (data lands in a subdirectory,
      # see docker-library/postgres#37)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ketabdaneh} -d ${POSTGRES_DB:-ketabdaneh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redis for the background notification job queue (Phase 5.7,
  # docs/01-ARCHITECTURE.md §6.5). Host port 6390 by default: a native or
  # container Redis may already occupy 6379, mirroring the PostgreSQL
  # 5433 convention above. No password for local development; production
  # infrastructure is out of scope (TBD T9).
  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6390}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
