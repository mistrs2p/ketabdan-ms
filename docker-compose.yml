name: ketabdaneh

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      # Values come from .env (copy from apps/api/.env.example to repo root or
      # export them). Never commit real secrets.
      POSTGRES_USER: ${POSTGRES_USER:-ketabdaneh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ketabdaneh_dev}
      POSTGRES_DB: ${POSTGRES_DB:-ketabdaneh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ recommended mount point (data lands in a subdirectory,
      # see docker-library/postgres#37)
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ketabdaneh} -d ${POSTGRES_DB:-ketabdaneh}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
