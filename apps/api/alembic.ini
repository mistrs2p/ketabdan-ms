# Alembic configuration for the Ketabdaneh API.
#
# The database URL is deliberately NOT set here. `alembic/env.py` reads it
# from the application's pydantic-settings configuration (the DATABASE_URL
# environment variable / apps/api/.env), so the same configuration controls
# the application and its migrations. Never put credentials in this file.
#
# Run all alembic commands from apps/api (the directory containing this file).

[alembic]
script_location = alembic
prepend_sys_path = .

# Injected by alembic/env.py from the application settings — left empty here.
sqlalchemy.url =

# No [loggers]/[handlers]/[formatters] sections: logging is owned by the
# application's central configuration (app/core/logging.py, Task 5.8).
# env.py deliberately does NOT call fileConfig with this file — that would
# replace the root handlers and disable existing loggers mid-process.
