[project]
name = "ketabdaneh-api"
version = "0.1.0"
description = "Ketabdaneh branch operations management API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    # Async HTTP client for the notification providers (Phase 5.6);
    # also the transport starlette's TestClient prefers.
    "httpx2>=2.0",
    # Async Redis-backed job queue for background notification delivery
    # (Phase 5.7; asyncio-native, redis-py async client underneath).
    "arq>=0.28",
    # Prometheus-compatible metrics for the observability foundation
    # (Task 5.9): the smallest maintainable option — plain client library,
    # no framework integration package.
    "prometheus-client>=0.26",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit instead of setuptools auto-discovery: this directory also
# contains alembic/ (migrations) and tests/, and a plain `pip install
# .` from the full tree — what CI does — fails auto-discovery with
# "multiple top-level packages". The package is `app` (the Dockerfile
# installs with only app/ in context, so it never hit this).
include = ["app*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # In-memory Redis for the offline worker/queue tests (Task 5.7).
    "fakeredis>=2.30",
    # Parsing the compose files in the repository-level security
    # regression tests (Task 5.13: tests/test_compose_security.py).
    # Dev/test only — never installed into the production image
    # (apps/api/Dockerfile installs [project] dependencies only).
    "pyyaml>=6.0",
]
